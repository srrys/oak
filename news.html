<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oak News and Documentation</title>
  <style>
    body {
      background-color: #000000;
      font-family: Courier New, monospace;
      margin: 0;
    }

    .heading {
      background: linear-gradient(to right, #139135, #33c47c);
      width: 100%;
      height: 100px;
      border: 1px solid #ffffff;
      display: grid;
      place-items: center;
      position: relative;
    }

    .heading h2 {
      margin: 0;
      color: #000;
    }

    .home-button {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background-color: white;
      padding: 8px 12px;
      border: 1px solid #3b3b3b;
      border-radius: 8px;
    }

    .home-button a {
      text-decoration: none;
      color: black;
      font-weight: bold;
    }

    .content-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 20px;
      padding: 20px;
      box-sizing: border-box;
      background: linear-gradient(to right, #404040, #ffffff);
    }

    .content-card {
      background-color: white;
      border: 2px solid #3b3b3b;
      border-radius: 20px;
      padding: 15px;
      width: 33%;
      vertical-align: top;
      box-sizing: border-box;
    }

    .card-icon {
      display: inline-block;
      width: 15px;
      height: 15px;
      background-color: #139135;
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
    }

    .card-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
      color: #000;
    }

    .tutorial-box {
      background-color: #139135;
      border: 2px solid black;
      border-radius: 12px;
      padding: 10px;
    }

    .tutorial-label {
      display: block;
      background-color: white;
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      font-weight: bold;
      color: black;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    video {
      width: 100%;
      max-width: 500px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="heading">
    <h2>News and Documentation</h2>
    <div class="home-button">
      <a href="home.html">Home</a>
    </div>
  </div>

  <table class="content-table">
    <tr>
      <td class="content-card">
        <div class="card-title"><span class="card-icon"></span>SimpLang extension</div>
        <p>Documentation and updates for the SimpLang extension.</p>
      </td>

      <td class="content-card">
        <div class="tutorial-box">
          <div class="tutorial-label">User Interface Tutorial:</div>
          <video controls>
            <source src="https://raw.githubusercontent.com/srrys/oak/main/tutorialUI1.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </td>

      <td class="content-card">
        <div class="card-title"><span class="card-icon"></span>News</div>
        <p>Latest release notes and project updates.</p>
      </td>
    </tr>
  </table>
</body>
</html>
