<!DOCTYPE html>
<head>
  <title>Oak News and Documentation</title>
  <style>
    body {
      background-color: #000000;
      font-family: Courier New;
    }
    .heading {
      background: linear-gradient(to right, #139135, #33c47c);
      width: 100%;
      height: 100px;
      border: 1px #ffffff;
      display: grid;
      place-items: center;
    }
    .speech {
      display: grid;
      place-items: center;
      background-color: #ffffff;
      border: 2px solid #3b3b3b;
      border-radius: 45px;
      width: 300px;
      height: 100px;
    }
    .main-content {
      display: inline-block;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <div class="heading">
    <h2>News and Documentation</h2>
  </div>
  <span class="main-content">
    <div>
      <img src="oakieM.png">
    </div>
    <div class="speech">
      <b>Oak 1.1.0 is up!</b>
    </div>
    <div style="background-color: #139135; border: 2px solid black; width: 400px;">
      <div style="background-color: white; width: 400px; height: 15px;">
        <b style="color: white;">User Interface Tutorial</b>
      </div>
      <video width="400" height="300" controls>
        <source src="https://raw.githubusercontent.com/srrys/oak/main/tutorialUI1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </span>
</body>
