<!DOCTYPE html>
<head>
  <title>Oak News and Documentation</title>
  <style>
    body {
      background-color: #000000;
      font-family: Courier New;
    }
    .heading {
      background: linear-gradient(to right, #139135, #33c47c);
      width: 100%;
      height: 100px;
      border: 1px #ffffff;
      display: grid;
      place-items: center;
    }
    .speech {
      background-color: #ffffff;
      border: 2px solid #3b3b3b;
      border-radius: 45px;
    }
  </style>
</head>
<body>
  <div class="heading">
    <h2>News and Documentation</h2>
  </div>
  <span>
    <div>
      <img src="oakieM.png">
    </div>
    <div class="speech"><b>Testing! I am Oakie the alien!</b></div>
  </span>
</body>
