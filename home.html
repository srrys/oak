<!DOCTYPE html>
<head>
  <title>Oak</title>
  <script src="mainScript.js" defer></script>
  <link rel="stylesheet" href="mainStyle.css">
</head>
<body>
  <div class="heading">
    <h2>Oak</h2>
    <h3>The 20-line programming language</h3>
    <div id="logIN" style="top:0; right:0;">
      <b id="userName" onclick="signIn()">Sign in</b>
    </div>
    <button onclick="tutorial()">Example code in oak</button>
  </div>
  <span id="main_content" class="ggh">
    <p style="color: white;">Type --help-- for a list of actions, click errors to go away</p>
    <textarea id="input" class="code" style="width: 350px; height: 130px;" maxlength="650">Insert code here.</textarea>
    <div class="out">
      <div style="background-color: #3b3b3b; width:350px; height: 250px">
        <div style="background-color: #ffffff; width: 350px; height: 30px">
          <button onclick="run()">Run code</button>
        </div>
        <div class="Ocont">
          <b>----------CONSOLE-----------</b>
          <p id="errors" style="color: #ba1e2b;" onclick="goAwayError()"></p>
          <p id="output"></p>
        </div>
        <div class="window" id="window">
          <div id="blockA" style="display: none;" class="redblock"></div>
        </div>
        <div class="windowUI" id="UIwindow">
          <b id="UItitle">//no title</b>
          <button id="buttonA" class="Bwin">//no title</button>
        </div>
      </div>
    </div>
    <div id="oakAlienM">
        <img src="oakieM.png">
    </div>
  </span>
</body>
