<!DOCTYPE html>
<head>
  <title>Oak</title>
  <script src="mainScript.js" defer></script>
  <link rel="stylesheet" href="mainStyle.css">
</head>
<body>
  <div class="heading">
    <h1>Oak  </h1>
    <h2>The 30-line programming language</h2>
  </div>
  <span id="main content" class="ggh">
    <textarea id="input" class="code" style="width: 250px; height: 130px;">Insert code here. Type --help-- for a list of actions</textarea>
    <div class="out">
      <div style="background-color: #3b3b3b; width:250px; height: 500px">
        <div style="background-color: #ffffff; width: 250px; height: 30px">
          <button onclick="run()">Run code</button>
        </div>
        <div class="Ocont">
          <b>---------CONSOLE----------</b>
          <p id="output"></p>
        </div>
      </div>
    </div>
  </span>
</body>
