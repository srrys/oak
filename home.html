<!DOCTYPE html>
<head>
  <title>Oak</title>
  <script src="mainScript.js" defer></script>
  <link rel="stylesheet" href="mainStyle.css">
</head>
<body>
  <div class="heading">
    <h1>Oak  </h1>
    <h2>The 20-line programming language</h2>
  </div>
  <span id="main content" class="ggh">
    <p style="color: white;">Type --help-- for a list of actions, click errors to go away</p>
    <textarea id="input" class="code" style="width: 250px; height: 130px;" maxlength="650">Insert code here.</textarea>
    <div class="out">
      <div style="background-color: #3b3b3b; width:250px; height: 500px">
        <div style="background-color: #ffffff; width: 250px; height: 30px">
          <button onclick="run()">Run code</button>
        </div>
        <div class="Ocont">
          <b>---------CONSOLE----------</b>
          <p id="errors" style="color: #ba1e2b;" onclick="goAwayError()"></p>
          <p id="output"></p>
        </div>
      </div>
    </div>
  </span>
</body>
